<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sudoku - Play Free</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="logo">Sudoku<span>.com</span></div>
  <div class="top-controls">
    <div class="difficulty-wrap">
      <label for="difficulty" style="font-weight:800;color:var(--muted);font-size:13px;">Level:</label>
      <div class="diff-pills" id="diffPills">
        <button class="diff-pill" data-diff="easy">Easy</button>
        <button class="diff-pill active" data-diff="medium">Medium</button>
        <button class="diff-pill" data-diff="hard">High</button>
        <button class="diff-pill" data-diff="expert">Pro</button>
        <button class="diff-pill" data-diff="custom">Custom</button>
      </div>
      <div id="customBlocksWrap" class="custom-blocks hidden">
        <span style="font-weight:800;font-size:12px;">Size:</span>
        <button class="size-pill" data-size="4">4×4 <span style="font-weight:600;opacity:0.8;">1-4</span></button>
        <button class="size-pill" data-size="6">6×6 <span style="font-weight:600;opacity:0.8;">1-6</span></button>
        <button class="size-pill active" data-size="9">9×9 <span style="font-weight:600;opacity:0.8;">1-9</span></button>
      </div>
      <select id="difficulty" style="display:none;">
        <option value="easy">Easy</option>
        <option value="medium" selected>Medium</option>
        <option value="hard">Hard</option>
        <option value="expert">Expert</option>
        <option value="custom">Custom</option>
      </select>
    </div>
  </div>
</header>

<main class="container">
  <div class="game-header">
    <div class="stat mistake-stat">
      <span class="stat-label">Mistakes</span>
      <span class="stat-value" id="mistakes">0/3</span>
    </div>
    <div class="stat timer-stat">
      <span class="stat-label">Time</span>
      <span class="stat-value" id="timer">00:00</span>
      <button id="pauseBtn" class="icon-btn small" title="Pause/Resume">⏸</button>
    </div>
    <div class="stat">
      <div id="bestScore" class="best-score" title="Best time for this difficulty">🏆 Best: <strong>—</strong></div>
      <button id="newGameTop" class="btn secondary small">New Game</button>
    </div>
  </div>

  <div class="board-wrap">
    <div id="board" class="board"></div>
  </div>

  <div class="controls">
    <button class="tool-btn" id="undoBtn" title="Undo (Ctrl+Z)">
      <span class="tool-icon">↩</span>
      <span>Undo</span>
    </button>
    <button class="tool-btn" id="eraseBtn" title="Erase (Del)">
      <span class="tool-icon">⌫</span>
      <span>Erase</span>
    </button>
    <button class="tool-btn" id="notesBtn" title="Notes (N)">
      <span class="tool-icon">✎</span>
      <span>Notes</span>
      <span id="notesIndicator" class="notes-indicator">OFF</span>
    </button>
    <button class="tool-btn" id="hintBtn" title="Hint">
      <span class="tool-icon">💡</span>
      <span>Hint</span>
    </button>
  </div>

  <div class="numpad" id="numpad">
    <!-- buttons 1-9 generated by JS, but static fallback -->
    <button data-num="1">1</button>
    <button data-num="2">2</button>
    <button data-num="3">3</button>
    <button data-num="4">4</button>
    <button data-num="5">5</button>
    <button data-num="6">6</button>
    <button data-num="7">7</button>
    <button data-num="8">8</button>
    <button data-num="9">9</button>
  </div>

  <div class="bottom-actions">
    <button id="newGameBtn" class="btn primary">New Game</button>
  </div>
</main>

<!-- Modals -->
<div id="winModal" class="modal hidden">
  <div class="modal-content">
    <h2>🎉 You Win!</h2>
    <p id="winTime">Time: 00:00</p>
    <p id="winMistakes"></p>
    <button id="winNewGame" class="btn primary">New Game</button>
  </div>
</div>

<div id="loseModal" class="modal hidden">
  <div class="modal-content">
    <h2>Game Over</h2>
    <p>You made 3 mistakes.</p>
    <button id="loseNewGame" class="btn primary">Try Again</button>
  </div>
</div>

<div id="confirmModal" class="modal hidden">
  <div class="modal-content">
    <h2>Start new game?</h2>
    <p>Current progress will be lost.</p>
    <div class="modal-actions">
      <button id="confirmYes" class="btn primary">Yes</button>
      <button id="confirmNo" class="btn secondary">Cancel</button>
    </div>
  </div>
</div>

<div id="hintModal" class="modal hidden">
  <div class="modal-content hint-modal-content">
    <div class="hint-header">
      <h2>💡 Hint</h2>
      <button id="hintCloseX" class="icon-btn small" style="position:absolute;right:16px;top:16px;">✕</button>
    </div>
    <p id="hintTarget" class="hint-target-text"></p>
    <div class="hint-answer-row">
      <span class="hint-answer-label">Answer:</span>
      <span id="hintAnswer" class="hint-answer"></span>
    </div>
    <div id="hintVisual" class="hint-mini-board"></div>
    <div class="hint-legend">
      <span><i class="dot dot-target"></i> Target cell</span>
      <span><i class="dot dot-row"></i> Same row</span>
      <span><i class="dot dot-col"></i> Same column</span>
      <span><i class="dot dot-box"></i> Same 3×3 box</span>
      <span><i class="dot dot-block"></i> Blocks other numbers</span>
    </div>
    <div id="hintExplain" class="hint-explain"></div>
    <div class="modal-actions">
      <button id="hintFillBtn" class="btn primary">Fill Answer</button>
      <button id="hintCloseBtn" class="btn secondary">Got it</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
